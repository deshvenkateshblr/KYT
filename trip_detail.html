<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <meta name="theme-color" content="#3B82F6">
          <title>Trip Detail - KYT</title>
          <link rel="icon" type="image/jpeg" href="./icons/KYT.jpg">
            <script src="./lib/tailwindcss.js?v=1791377680"></script>
            <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
              <script src="./lib/lucide.js?v=1791377680"></script>
              <style>
                body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }
                .hide-scrollbar::-webkit-scrollbar { display: none; }
                .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
              </style>
            </head>
  <body class="text-slate-800 antialiased h-screen flex flex-col overflow-hidden">

    <!-- Floating App Toolbar (Driven by KYT.header.renderMainToolbar) -->
    <header id="main-toolbar" class="w-full max-w-md mx-auto flex justify-between items-center z-[60] bg-white/50 backdrop-blur-md rounded-2xl p-2 border border-white/60 shadow-sm mt-3 px-3 sm:px-4 mb-2 relative shrink-0">
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto hide-scrollbar">
      <!-- Breadcrumb back link -->
      <div class="max-w-5xl mx-auto px-4 pt-1 pb-2">
        <a href="virtual_trip.html" id="detail-back-link" class="inline-flex items-center gap-1.5 text-xs font-bold text-slate-500 hover:text-blue-600 active:scale-95 transition-all bg-white px-3 py-1.5 rounded-full border border-slate-200 shadow-xs">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
          <span id="detail-back-label">Back to My Trips</span>
        </a>
      </div>

      <!-- Hero Banner -->
      <div class="bg-blue-50 py-8 px-4 text-center border-b border-blue-100">
        <h2 class="text-3xl font-black text-blue-900 mb-2" id="trip-title">Explore your curated journey</h2>
        <p class="text-sm text-blue-700 max-w-md mx-auto mb-5" id="trip-desc">Check out this curated journey featuring amazing cities and rich cultural experiences.</p>
        <div class="flex flex-wrap items-center justify-center gap-3">
          <button id="btn-share-trip" class="bg-white text-blue-600 border border-blue-200 px-5 py-2 rounded-full text-sm font-bold shadow-sm hover:bg-blue-50 transition-colors flex items-center gap-2">
            <i data-lucide="share-2" class="w-4 h-4"></i> Share
          </button>
          <button id="btn-edit-plan" class="bg-blue-600 text-white px-5 py-2 rounded-full text-sm font-bold shadow hover:bg-blue-700 transition-colors flex items-center gap-2">
            <i data-lucide="edit-3" class="w-4 h-4"></i> Customize
          </button>
        </div>
      </div>

      <div class="p-4 max-w-5xl mx-auto space-y-8">
        <!-- Cities Section -->
        <div>
          <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4">Destinations & Attractions</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="cities-grid">
            <!-- Populated via KYT.ui.renderCityCard -->
          </div>
        </div>

        <!-- Video Gallery Section -->
        <div>
          <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-4 gap-3 border-t border-slate-200 pt-6">
            <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest whitespace-nowrap">Video Gallery</h3>
            <div id="video-filters" class="flex flex-wrap gap-2">
              <!-- Filters populated via JS -->
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4" id="video-gallery">
            <!-- Populated via JS -->
          </div>
        </div>
      </div>
    </main>

    <!-- RICH CITY DETAIL SLIDE-OVER -->
    <div id="city-detail-overlay" class="fixed inset-0 z-[100] bg-slate-900/40 backdrop-blur-sm hidden transition-opacity opacity-0 flex flex-col justify-end">
      <div id="city-detail-panel" class="bg-white w-full h-[90vh] md:w-full md:max-w-md md:h-full md:ml-auto rounded-t-3xl md:rounded-none shadow-2xl flex flex-col transform translate-y-full md:translate-y-0 md:translate-x-full transition-transform duration-300">

        <!-- Sticky Header -->
        <div class="flex items-center justify-between p-4 bg-white border-b border-slate-100 shrink-0 rounded-t-3xl md:rounded-none z-20">
          <div class="flex items-center gap-2 flex-1 min-w-0 pr-4">
            <button type="button" id="btn-back-city-detail" class="p-2 -ml-2 text-slate-400 hover:text-slate-800 bg-transparent hover:bg-slate-50 rounded-full transition-colors shrink-0" title="Back">
              <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </button>
            <div class="min-w-0">
              <p id="cd-state-tag" class="text-[10px] font-black tracking-widest text-slate-400 uppercase mb-0.5 line-clamp-1">State</p>
              <h2 id="cd-title" class="text-xl font-black text-slate-800 tracking-tight line-clamp-1">City Name</h2>
            </div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <button type="button" id="btn-share-city" class="p-2 text-slate-400 hover:text-blue-600 bg-slate-50 hover:bg-blue-50 rounded-full transition-colors" title="Share City">
              <i data-lucide="share-2" class="w-5 h-5"></i>
            </button>
            <button type="button" id="btn-close-city-detail" class="p-2 text-slate-400 hover:text-rose-600 bg-slate-50 hover:bg-rose-50 rounded-full transition-colors" title="Close">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
          </div>
        </div>

        <div class="flex-1 overflow-y-auto bg-slate-50 relative flex flex-col pb-6">
          <!-- Video / Hero Container -->
          <div class="relative w-full aspect-video bg-slate-900 shrink-0 overflow-hidden flex items-center justify-center">
            <i data-lucide="image" id="cd-hero-placeholder" class="w-12 h-12 text-slate-700 opacity-50"></i>
          </div>

          <div class="p-5 space-y-6">
            <!-- Actions & Description -->
            <div class="flex flex-col gap-4">
              <div class="flex justify-between items-start gap-4">
                <p id="cd-description" class="text-sm text-slate-600 leading-relaxed font-medium flex-1">Description goes here...</p>
                <button id="cd-btn-add-main" class="shrink-0 bg-blue-600 text-white shadow-lg shadow-blue-600/30 font-bold px-4 py-2 rounded-xl text-xs hover:bg-blue-700 active:scale-95 transition-all flex items-center gap-1.5">
                  <i data-lucide="edit-3" class="w-3.5 h-3.5"></i> Customize
                </button>
              </div>
            </div>

            <!-- Attractions -->
            <div>
              <h3 class="text-xs font-black text-slate-800 uppercase tracking-wider mb-3">Top Attractions</h3>
              <div id="cd-attractions-list" class="space-y-3"></div>
            </div>

            <!-- Nearby Tourist Cities -->
            <div class="pt-2">
              <h3 class="text-xs font-black text-slate-800 uppercase tracking-wider mb-3">Nearby Destinations</h3>
              <div class="grid grid-cols-2 gap-3 pb-4" id="cd-nearby-list"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 p-4 shrink-0 text-center text-xs text-slate-400 font-medium mt-auto">
      Built with KYT &mdash; Know Your Travel
    </footer>

    <!-- Data & UI Dependencies -->
    <script src="data/cities.js?v=1791377680"></script>
    <script src="data/distance_matrix.js?v=1791377680"></script>
    <script src="data/city_videos_data.js?v=1791377680"></script>
    <script src="data/curated_trips.js?v=1791377680"></script>
    <script src="js/header.js?v=1791377680"></script>
    <script src="js/ui-components.js?v=1792065000"></script>

    <!-- Page Logic -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      let tripName = params.get('trip') || 'My Trip';
      let citiesParam = params.get('cities');
      let tasteParam = params.get('taste') || '';
      let curatedParam = params.get('curated') || '';
      const tripId = params.get('id');

      // Setup Unified Header Navigation
      const isFromCurated = Boolean(curatedParam && !tripId && (document.referrer.includes('curated_trips.html') || !document.referrer.includes('virtual_trip.html')));
      const backUrl = isFromCurated ? 'curated_trips.html' : 'virtual_trip.html';
      const backLabel = isFromCurated ? 'Curated Trips' : 'My Trips';

      const backLink = document.getElementById('detail-back-link');
      const backLinkText = document.getElementById('detail-back-label');
      if (backLink) backLink.href = backUrl;
      if (backLinkText) backLinkText.textContent = `Back to ${backLabel}`;

      if (window.KYT && window.KYT.header) {
      KYT.header.renderMainToolbar('main-toolbar', { active: isFromCurated ? 'curated' : 'virtual' });
      }

      if (tripId) {
      try {
      const vtrips = JSON.parse(localStorage.getItem('kyt_virtual_trips') || '[]');
      const trip = vtrips.find(t => t.id === tripId);
      if (trip) {
      tripName = trip.name || 'My Trip';
      if (trip.curatedId) curatedParam = trip.curatedId;

      const shortC = trip.cities.map(id => {
      const c = KYT.ui.resolveCity(id);
      return c && c.code ? c.code : id;
      });
      citiesParam = shortC.join(',');

      const codeMap = {
      intent: { mixed: 'm', spiritual: 's', cultural: 'c', adventure: 'a', culinary: 'u' },
      diet: { any: 'a', veg: 'v', jain: 'j', satvik: 'k' },
      pace: { short: 'h', standard: 's', deep: 'd' }
      };
      tasteParam = (codeMap.intent[trip.taste.intent] || 'm') + (codeMap.diet[trip.taste.diet] || 'a') + (codeMap.pace[trip.taste.pace] || 's');
      const curQ = curatedParam ? `&curated=${encodeURIComponent(curatedParam)}` : '';
      window.history.replaceState({}, '', `?trip=${encodeURIComponent(tripName)}&cities=${citiesParam}&taste=${tasteParam}${curQ}`);
      }
      } catch(e) {}
      }

      try {
      tripName = decodeURIComponent(tripName.replace(/\+/g, ' '));
      } catch(e) {}
      document.getElementById('trip-title').textContent = tripName;

      if (curatedParam && window.KYT_CURATED_TRIPS) {
      const cTrip = window.KYT_CURATED_TRIPS.find(t => t.id === curatedParam);
      if (cTrip && cTrip.tagline) {
      const descEl = document.getElementById('trip-desc');
      if (descEl) descEl.textContent = cTrip.tagline;
      }
      }

      const btnShare = document.getElementById('btn-share-trip');
      if (btnShare) {
      btnShare.addEventListener('click', () => {
      const url = window.location.href;
      const shareData = {
      title: `Check out ${tripName} on KYT`,
      text: `Explore this curated journey featuring amazing cities and rich cultural experiences!`,
      url: url
      };
      if (navigator.share) {
      navigator.share(shareData).catch(err => console.log('Error sharing:', err));
      } else {
      navigator.clipboard.writeText(url)
      .then(() => alert('Trip link copied to clipboard!'))
      .catch(err => console.error('Error copying link:', err));
      }
      });
      }

      document.getElementById('btn-edit-plan').addEventListener('click', () => {
      if (tripId) {
      window.location.href = `virtual_trip.html?id=${tripId}`;
      } else {
      window.location.href = `virtual_trip.html${window.location.search}`;
      }
      });

      const citiesGrid = document.getElementById('cities-grid');
      const videoGallery = document.getElementById('video-gallery');
      const videoFilters = document.getElementById('video-filters');

      if (!citiesParam) {
      citiesGrid.innerHTML = '<p class="text-sm text-slate-500">No cities selected in this trip.</p>';
      lucide.createIcons();
      return;
      }

      const cityIds = citiesParam.split(',').map(code => {
      const c = KYT.ui.resolveCity(code);
      return c ? c.id : code;
      });

      let citiesHtml = '';
      const allVideos = [];
      const filterCities = [];

      cityIds.forEach(cId => {
      const city = KYT.ui.resolveCity(cId);
      if (!city) return;

      filterCities.push({ id: city.id, name: city.name });
      citiesHtml += KYT.ui.renderCityCard(city, { variant: 'summary' });

      const cityVideos = window.KYT_CITY_VIDEOS ? (window.KYT_CITY_VIDEOS[city.id] || []) : [];
      cityVideos.forEach(vid => {
      allVideos.push({ ...vid, cityName: city.name, cityId: city.id });
      });
      });

      citiesGrid.innerHTML = citiesHtml || '<p class="text-sm text-slate-500">Could not load city details.</p>';

      // Video Gallery Rendering
      let currentFilter = 'all';

      function renderVideos() {
      const filtered = currentFilter === 'all' ? allVideos : allVideos.filter(v => v.cityId === currentFilter);
      if (filtered.length === 0) {
      videoGallery.innerHTML = '<p class="text-sm text-slate-500 p-4 border border-dashed border-slate-200 rounded-xl text-center w-full col-span-full">No videos available.</p>';
      return;
      }

      videoGallery.innerHTML = filtered.map(vid => `
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
        <div class="relative w-full aspect-video bg-slate-100">
          <iframe class="absolute inset-0 w-full h-full" src="https://www.youtube-nocookie.com/embed/${KYT.utils.escapeHTML(vid.id)}?rel=0" frameborder="0" allowfullscreen=""></iframe>
        </div>
        <div class="p-3 flex-1 flex flex-col justify-between">
          <p class="text-sm font-bold text-slate-800 line-clamp-2 mb-2">${KYT.utils.escapeHTML(vid.title)}</p>
          <div class="flex justify-between items-center mt-auto">
            <span class="text-[10px] font-bold text-blue-500 uppercase">${KYT.utils.escapeHTML(vid.cityName)}</span>
            <span class="text-[10px] text-slate-400 font-bold">${KYT.utils.escapeHTML(vid.channel)}</span>
          </div>
        </div>
      </div>
      `).join('');
      }

      function renderFilters() {
      if (allVideos.length === 0) return;

      let filtersHtml = `
      <button class="filter-btn px-3 py-1 rounded-full text-xs font-bold transition-colors ${currentFilter === 'all' ? 'bg-slate-800 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}" data-id="all">
        All
      </button>
      `;

      filterCities.forEach(city => {
      if (allVideos.some(v => v.cityId === city.id)) {
      const isActive = currentFilter === city.id;
      filtersHtml += `
      <button class="filter-btn px-3 py-1 rounded-full text-xs font-bold transition-colors ${isActive ? 'bg-slate-800 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}" data-id="${KYT.utils.escapeHTML(city.id)}">
        ${KYT.utils.escapeHTML(city.name)}
      </button>
      `;
      }
      });

      videoFilters.innerHTML = filtersHtml;

      document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
      currentFilter = e.target.dataset.id;
      renderFilters();
      renderVideos();
      });
      });
      }

      renderFilters();
      renderVideos();

      // Configure Unified City Detail Slide-Over
      KYT.ui.cityDetail.configure({
      mode: 'explore',
      onPrimaryAction: () => {
      document.getElementById('btn-edit-plan').click();
      }
      });

      const cityOverlay = document.getElementById('city-detail-overlay');
      const btnCloseCity = document.getElementById('btn-close-city-detail');
      const btnBackCity = document.getElementById('btn-back-city-detail');
      const btnShareCity = document.getElementById('btn-share-city');

      citiesGrid.addEventListener('click', (e) => {
      const card = e.target.closest('[data-city-id]');
      if (card) {
      KYT.ui.cityDetail.open(card.dataset.cityId, true);
      }
      });

      const nearbyContainer = document.getElementById('cd-nearby-list');
      if (nearbyContainer) {
      nearbyContainer.addEventListener('click', (e) => {
      const nCard = e.target.closest('[data-nearby-id]');
      if (nCard) {
      KYT.ui.cityDetail.open(nCard.dataset.nearbyId, true);
      }
      });
      }

      if (btnCloseCity) {
      btnCloseCity.addEventListener('click', () => KYT.ui.cityDetail.close(true));
      }
      if (btnBackCity) {
      btnBackCity.addEventListener('click', () => window.history.back());
      }
      if (btnShareCity) {
      btnShareCity.addEventListener('click', () => {
      const currentCityId = document.getElementById('cd-title').dataset.cityId;
      const currentCityName = document.getElementById('cd-title').textContent;
      const url = new URL(window.location.href);
      url.searchParams.set('city', currentCityId);
      const shareData = {
      title: `${currentCityName} - KYT Destination`,
      text: `Explore ${currentCityName} on KYT: attractions, travel styles, and nearby gems!`,
      url: url.toString()
      };
      if (navigator.share) {
      navigator.share(shareData).catch(() => {});
      } else {
      navigator.clipboard.writeText(url.toString())
      .then(() => alert(`Link for ${currentCityName} copied to clipboard!`))
      .catch(() => {});
      }
      });
      }

      if (cityOverlay) {
      cityOverlay.addEventListener('click', (e) => {
      if (e.target === cityOverlay) KYT.ui.cityDetail.close(true);
      });
      }

      window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && cityOverlay && !cityOverlay.classList.contains('hidden')) {
      KYT.ui.cityDetail.close(true);
      }
      });

      window.addEventListener('popstate', () => {
      const p = new URLSearchParams(window.location.search);
      const cityParam = p.get('city');
      if (cityParam) {
      KYT.ui.cityDetail.open(cityParam, false);
      } else if (cityOverlay && !cityOverlay.classList.contains('hidden')) {
      KYT.ui.cityDetail.close(false);
      }
      });

      const initialCity = params.get('city');
      if (initialCity) {
      KYT.ui.cityDetail.open(initialCity, false);
      }

      lucide.createIcons();
      });
    </script>
  </body>
</html>
