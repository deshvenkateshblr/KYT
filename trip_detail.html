<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#3B82F6">
  <title>Trip Detail - KYT</title>
  <link rel="icon" type="image/jpeg" href="./icons/KYT.jpg">
  <script src="./lib/tailwindcss.js?v=1791377680"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="./lib/lucide.js?v=1791377680"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-slate-800 antialiased h-screen flex flex-col overflow-hidden">
  
  <!-- Floating App Toolbar (Driven by KYT.header.renderMainToolbar) -->
  <header id="main-toolbar" class="w-full max-w-md mx-auto flex justify-between items-center z-[60] bg-white/50 backdrop-blur-md rounded-2xl p-2 border border-white/60 shadow-sm mt-3 px-3 sm:px-4 mb-2 relative shrink-0">
  </header>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto hide-scrollbar">
    <!-- Breadcrumb back link -->
    <div class="max-w-5xl mx-auto px-4 pt-1 pb-2">
      <a href="virtual_trip.html" id="detail-back-link" class="inline-flex items-center gap-1.5 text-xs font-bold text-slate-500 hover:text-blue-600 active:scale-95 transition-all bg-white px-3 py-1.5 rounded-full border border-slate-200 shadow-xs">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        <span id="detail-back-label">Back to My Trips</span>
      </a>
    </div>

    <!-- Hero Banner -->
    <div class="bg-blue-50 py-8 px-4 text-center border-b border-blue-100">
      <h2 class="text-3xl font-black text-blue-900 mb-2" id="trip-title">Explore your curated journey</h2>
      <p class="text-sm text-blue-700 max-w-md mx-auto mb-5" id="trip-desc">Check out this curated journey featuring amazing cities and rich cultural experiences.</p>
      <div class="flex flex-wrap items-center justify-center gap-3">
        <button id="btn-share-trip" class="bg-white text-blue-600 border border-blue-200 px-5 py-2 rounded-full text-sm font-bold shadow-sm hover:bg-blue-50 transition-colors flex items-center gap-2">
          <i data-lucide="share-2" class="w-4 h-4"></i> Share
        </button>
        <button id="btn-edit-plan" class="bg-blue-600 text-white px-5 py-2 rounded-full text-sm font-bold shadow hover:bg-blue-700 transition-colors flex items-center gap-2">
          <i data-lucide="edit-3" class="w-4 h-4"></i> Customize
        </button>
      </div>
    </div>

    <div class="p-4 max-w-5xl mx-auto space-y-8">
      <!-- Cities Section -->
      <div>
        <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4">Destinations & Attractions</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="cities-grid">
          <!-- Populated via JS -->
        </div>
      </div>

      <!-- Video Gallery Section -->
      <div>
        <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-4 gap-3 border-t border-slate-200 pt-6">
            <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest whitespace-nowrap">Video Gallery</h3>
            <div id="video-filters" class="flex flex-wrap gap-2">
                <!-- Filters populated via JS -->
            </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4" id="video-gallery">
          <!-- Populated via JS -->
        </div>
      </div>
    </div>
  </main>

  <!-- RICH CITY DETAIL SLIDE-OVER -->
  <div id="city-detail-overlay" class="fixed inset-0 z-[100] bg-slate-900/40 backdrop-blur-sm hidden transition-opacity opacity-0 flex flex-col justify-end">
    <!-- Slide-up sheet on mobile, side-panel on desktop -->
    <div id="city-detail-panel" class="bg-white w-full h-[90vh] md:w-full md:max-w-md md:h-full md:ml-auto rounded-t-3xl md:rounded-none shadow-2xl flex flex-col transform translate-y-full md:translate-y-0 md:translate-x-full transition-transform duration-300">
      
      <!-- Sticky Header -->
      <div class="flex items-center justify-between p-4 bg-white border-b border-slate-100 shrink-0 rounded-t-3xl md:rounded-none z-20">
         <div class="flex items-center gap-2 flex-1 min-w-0 pr-4">
            <button type="button" id="btn-back-city-detail" class="p-2 -ml-2 text-slate-400 hover:text-slate-800 bg-transparent hover:bg-slate-50 rounded-full transition-colors shrink-0" title="Back">
              <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </button>
            <div class="min-w-0">
                <p id="cd-state-tag" class="text-[10px] font-black tracking-widest text-slate-400 uppercase mb-0.5 line-clamp-1">State</p>
                <h2 id="cd-title" class="text-xl font-black text-slate-800 tracking-tight line-clamp-1">City Name</h2>
            </div>
         </div>
         <div class="flex items-center gap-2 shrink-0">
            <button type="button" id="btn-share-city" class="p-2 text-slate-400 hover:text-blue-600 bg-slate-50 hover:bg-blue-50 rounded-full transition-colors" title="Share City">
              <i data-lucide="share-2" class="w-5 h-5"></i>
            </button>
            <button type="button" id="btn-close-city-detail" class="p-2 text-slate-400 hover:text-rose-600 bg-slate-50 hover:bg-rose-50 rounded-full transition-colors" title="Close">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
         </div>
      </div>
      
      <div class="flex-1 overflow-y-auto bg-slate-50 relative flex flex-col pb-6">
        
        <!-- Video / Hero Container -->
        <div class="relative w-full aspect-video bg-slate-900 shrink-0 overflow-hidden flex items-center justify-center">
          <i data-lucide="image" id="cd-hero-placeholder" class="w-12 h-12 text-slate-700 opacity-50"></i>
        </div>

        <div class="p-5 space-y-6">
          
          <!-- Actions & Description -->
          <div class="flex flex-col gap-4">
            <div class="flex justify-between items-start gap-4">
               <p id="cd-description" class="text-sm text-slate-600 leading-relaxed font-medium flex-1">Description goes here...</p>
               <button id="cd-btn-add-main" class="shrink-0 bg-blue-600 text-white shadow-lg shadow-blue-600/30 font-bold px-4 py-2 rounded-xl text-xs hover:bg-blue-700 active:scale-95 transition-all flex items-center gap-1.5">
                 <i data-lucide="edit-3" class="w-3.5 h-3.5"></i> Customize
               </button>
            </div>
          </div>
          
          <!-- Attractions -->
          <div>
            <h3 class="text-xs font-black text-slate-800 uppercase tracking-wider mb-3">Top Attractions</h3>
            <div id="cd-attractions-list" class="space-y-3">
              <!-- Injected dynamically -->
            </div>
          </div>

          <!-- Nearby Tourist Cities -->
          <div class="pt-2">
            <h3 class="text-xs font-black text-slate-800 uppercase tracking-wider mb-3">Nearby Destinations</h3>
            <div class="grid grid-cols-2 gap-3 pb-4" id="cd-nearby-list">
              <!-- Injected dynamically -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 p-4 shrink-0 text-center text-xs text-slate-400 font-medium mt-auto">
    Built with KYT &mdash; Know Your Travel
  </footer>

  <!-- Data Dependencies -->
  <script src="data/cities.js?v=1791377680"></script>
  <script src="data/distance_matrix.js?v=1791377680"></script>
  <script src="data/city_videos_data.js?v=1791377680"></script>
  <script src="data/curated_trips.js?v=1791377680"></script>
  <script src="js/header.js?v=1791377680"></script>

  <!-- Logic -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      let tripName = params.get('trip') || 'My Trip';
      let citiesParam = params.get('cities');
      let tasteParam = params.get('taste') || '';
      let curatedParam = params.get('curated') || '';
      const tripId = params.get('id');

      // Setup Unified Header Navigation
      const isFromCurated = Boolean(curatedParam && !tripId && (document.referrer.includes('curated_trips.html') || !document.referrer.includes('virtual_trip.html')));
      const backUrl = isFromCurated ? 'curated_trips.html' : 'virtual_trip.html';
      const backLabel = isFromCurated ? 'Curated Trips' : 'My Trips';

      const backLink = document.getElementById('detail-back-link');
      const backLinkText = document.getElementById('detail-back-label');
      if (backLink) backLink.href = backUrl;
      if (backLinkText) backLinkText.textContent = `Back to ${backLabel}`;

      if (window.KYT && window.KYT.header) {
        KYT.header.renderMainToolbar('main-toolbar', { active: isFromCurated ? 'curated' : 'virtual' });
      }

      lucide.createIcons();
      if (tripId) {
        try {
          const vtrips = JSON.parse(localStorage.getItem('kyt_virtual_trips') || '[]');
          const trip = vtrips.find(t => t.id === tripId);
          if (trip) {
            tripName = trip.name || 'My Trip';
            if (trip.curatedId) curatedParam = trip.curatedId;
            
            const shortC = trip.cities.map(id => {
              const c = window.KYT_CITIES ? window.KYT_CITIES.find(x => x.id === id) : null;
              return c && c.code ? c.code : id;
            });
            citiesParam = shortC.join(',');

            const codeMap = {
              intent: { mixed: 'm', spiritual: 's', cultural: 'c', adventure: 'a', culinary: 'u' },
              diet: { any: 'a', veg: 'v', jain: 'j', satvik: 'k' },
              pace: { short: 'h', standard: 's', deep: 'd' }
            };
            tasteParam = (codeMap.intent[trip.taste.intent] || 'm') + (codeMap.diet[trip.taste.diet] || 'a') + (codeMap.pace[trip.taste.pace] || 's');
            // update URL for the edit button to work seamlessly
            const curQ = curatedParam ? `&curated=${encodeURIComponent(curatedParam)}` : '';
            window.history.replaceState({}, '', `?trip=${encodeURIComponent(tripName)}&cities=${citiesParam}&taste=${tasteParam}${curQ}`);
          }
        } catch(e) {}
      }
      
      try {
          tripName = decodeURIComponent(tripName.replace(/\+/g, ' '));
      } catch(e) {}
      document.getElementById('trip-title').textContent = tripName;

      if (curatedParam && window.KYT_CURATED_TRIPS) {
        const cTrip = window.KYT_CURATED_TRIPS.find(t => t.id === curatedParam);
        if (cTrip && cTrip.tagline) {
          const descEl = document.getElementById('trip-desc');
          if (descEl) descEl.textContent = cTrip.tagline;
        }
      }


      const btnShare = document.getElementById('btn-share-trip');
      if (btnShare) {
        btnShare.addEventListener('click', () => {
          const url = window.location.href;
          const shareData = {
            title: `Check out ${tripName} on KYT`,
            text: `Explore this curated journey featuring amazing cities and rich cultural experiences!`,
            url: url
          };
          if (navigator.share) {
            navigator.share(shareData).catch(err => console.log('Error sharing:', err));
          } else {
            navigator.clipboard.writeText(url)
              .then(() => alert('Trip link copied to clipboard!'))
              .catch(err => console.error('Error copying link:', err));
          }
        });
      }

      document.getElementById('btn-edit-plan').addEventListener('click', () => {
        if (tripId) {
          window.location.href = `virtual_trip.html?id=${tripId}`;
        } else {
          window.location.href = `virtual_trip.html${window.location.search}`;
        }
      });

      if (!citiesParam) {
        document.getElementById('cities-grid').innerHTML = '<p class="text-sm text-slate-500">No cities selected in this trip.</p>';
        return;
      }

      const cityIds = citiesParam.split(',').map(code => {
        const c = window.KYT_CITIES ? window.KYT_CITIES.find(x => x.code === code || x.id === code) : null;
        return c ? c.id : code;
      });
      const citiesGrid = document.getElementById('cities-grid');
      const videoGallery = document.getElementById('video-gallery');
      const videoFilters = document.getElementById('video-filters');

      let citiesHtml = '';
      
      // Collect all videos
      const allVideos = [];
      const filterCities = [];

      cityIds.forEach(cId => {
        const city = window.KYT_CITIES ? window.KYT_CITIES.find(c => c.id === cId) : null;
        if (!city) return;

        filterCities.push({ id: city.id, name: city.name });

        // City Card with Attractions (Beats)
        let beatsHtml = '';
        if (city.beats && city.beats.length > 0) {
          beatsHtml = '<div class="mt-4 space-y-2">';
          city.beats.forEach(beat => {
            beatsHtml += `
              <div class="flex items-start gap-2 bg-slate-50 p-2 rounded-lg border border-slate-100">
                <i data-lucide="${beat.icon || 'map-pin'}" class="w-4 h-4 text-slate-400 shrink-0 mt-0.5"></i>
                <div>
                  <h5 class="text-xs font-bold text-slate-700">${beat.title}</h5>
                  ${beat.where ? `<p class="text-[10px] text-slate-500">${beat.where}</p>` : ''}
                </div>
              </div>
            `;
          });
          beatsHtml += '</div>';
        }

        citiesHtml += `
          <div class="bg-white rounded-xl border border-slate-200 hover:border-blue-400 p-4 shadow-sm hover:shadow-md transition-all flex flex-col h-full cursor-pointer group" data-city-id="${city.id}">
            <div class="flex items-start justify-between gap-3">
              <div class="flex items-start gap-3">
                <div class="p-2 bg-blue-50 text-blue-500 rounded-lg shrink-0 group-hover:bg-blue-600 group-hover:text-white transition-colors">
                  <i data-lucide="${city.icon || 'map-pin'}" class="w-6 h-6"></i>
                </div>
                <div>
                  <h4 class="text-lg font-bold text-slate-800 group-hover:text-blue-600 transition-colors">${city.name}</h4>
                  <p class="text-xs text-slate-500 mt-1 line-clamp-3">${city.notes || 'A beautiful destination to explore.'}</p>
                </div>
              </div>
              <div class="text-slate-300 group-hover:text-blue-500 group-hover:translate-x-0.5 transition-all shrink-0 p-1">
                <i data-lucide="chevron-right" class="w-5 h-5"></i>
              </div>
            </div>
            <div class="flex-1">
                ${beatsHtml}
            </div>
            <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-blue-600 font-semibold group-hover:text-blue-700">
              <span>View city details & videos</span>
              <span class="flex items-center gap-1">Explore <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i></span>
            </div>
          </div>
        `;

        // Videos
        const cityVideos = window.KYT_CITY_VIDEOS ? (window.KYT_CITY_VIDEOS[city.id] || []) : [];
        cityVideos.forEach(vid => {
            allVideos.push({ ...vid, cityName: city.name, cityId: city.id });
        });
      });

      citiesGrid.innerHTML = citiesHtml || '<p class="text-sm text-slate-500">Could not load city details.</p>';

      // Video Rendering
      let currentFilter = 'all';

      function renderVideos() {
        const filtered = currentFilter === 'all' ? allVideos : allVideos.filter(v => v.cityId === currentFilter);
        
        if (filtered.length === 0) {
            videoGallery.innerHTML = '<p class="text-sm text-slate-500 p-4 border border-dashed border-slate-200 rounded-xl text-center w-full col-span-full">No videos available.</p>';
            return;
        }

        let videosHtml = '';
        filtered.forEach(vid => {
          videosHtml += `
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
              <div class="relative w-full aspect-video bg-slate-100">
                <iframe class="absolute inset-0 w-full h-full" src="https://www.youtube-nocookie.com/embed/${vid.id}?rel=0" frameborder="0" allowfullscreen></iframe>
              </div>
              <div class="p-3 flex-1 flex flex-col justify-between">
                <p class="text-sm font-bold text-slate-800 line-clamp-2 mb-2">${vid.title}</p>
                <div class="flex justify-between items-center mt-auto">
                  <span class="text-[10px] font-bold text-blue-500 uppercase">${vid.cityName}</span>
                  <span class="text-[10px] text-slate-400 font-bold">${vid.channel}</span>
                </div>
              </div>
            </div>
          `;
        });
        videoGallery.innerHTML = videosHtml;
      }

      function renderFilters() {
        if (allVideos.length === 0) return;

        let filtersHtml = `
            <button class="filter-btn px-3 py-1 rounded-full text-xs font-bold transition-colors ${currentFilter === 'all' ? 'bg-slate-800 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}" data-id="all">
                All
            </button>
        `;

        filterCities.forEach(city => {
            // Only show filter if city has videos
            if (allVideos.some(v => v.cityId === city.id)) {
                const isActive = currentFilter === city.id;
                filtersHtml += `
                    <button class="filter-btn px-3 py-1 rounded-full text-xs font-bold transition-colors ${isActive ? 'bg-slate-800 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}" data-id="${city.id}">
                        ${city.name}
                    </button>
                `;
            }
        });
        
        videoFilters.innerHTML = filtersHtml;

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                currentFilter = e.target.dataset.id;
                renderFilters();
                renderVideos();
            });
        });
      }

      renderFilters();
      renderVideos();

      // ==========================================
      // RICH CITY DETAIL PANEL LOGIC
      // ==========================================
      const cityOverlay = document.getElementById('city-detail-overlay');
      const cityPanel = document.getElementById('city-detail-panel');
      const btnCloseCity = document.getElementById('btn-close-city-detail');
      const btnBackCity = document.getElementById('btn-back-city-detail');
      const btnShareCity = document.getElementById('btn-share-city');
      const cdBtnAddMain = document.getElementById('cd-btn-add-main');
      const cityHistoryStack = [];

      function openCityDetail(cityId, pushHistory = true) {
        if (!window.KYT_CITIES) return;
        const city = window.KYT_CITIES.find(c => c.id === cityId);
        if (!city) return;

        if (pushHistory) {
          const url = new URL(window.location.href);
          url.searchParams.set('city', cityId);
          window.history.pushState({ cityId }, '', url.toString());
          cityHistoryStack.push(cityId);
        }

        // Toggle back button visibility if multiple cities navigated
        if (btnBackCity) {
          if (cityHistoryStack.length > 1) {
            btnBackCity.classList.remove('hidden');
          } else {
            btnBackCity.classList.add('hidden');
          }
        }

        // Populate basic information
        document.getElementById('cd-title').textContent = city.name;
        document.getElementById('cd-title').dataset.cityId = city.id;
        document.getElementById('cd-state-tag').textContent = city.state || 'India';
        document.getElementById('cd-description').textContent = city.notes || 'A beautiful destination to explore.';

        // Video Carousel Logic
        const heroPlaceholder = document.getElementById('cd-hero-placeholder');
        const headerDiv = heroPlaceholder ? heroPlaceholder.parentElement : null;

        const oldIframe = document.getElementById('cd-hero-yt');
        if (oldIframe) oldIframe.remove();
        const oldControls = document.getElementById('cd-yt-controls');
        if (oldControls) oldControls.remove();

        const videos = window.KYT_CITY_VIDEOS ? (window.KYT_CITY_VIDEOS[city.id] || []) : [];

        if (videos.length > 0 && headerDiv) {
          heroPlaceholder.classList.add('hidden');
          let currentVidIdx = 0;

          const iframe = document.createElement('iframe');
          iframe.id = 'cd-hero-yt';
          iframe.className = 'absolute inset-0 w-full h-full object-cover z-0';
          iframe.src = `https://www.youtube-nocookie.com/embed/${videos[currentVidIdx].id}?rel=0&modestbranding=1`;
          iframe.allowFullscreen = true;
          iframe.style.border = 'none';

          headerDiv.insertBefore(iframe, heroPlaceholder);

          if (videos.length > 1) {
            const controls = document.createElement('div');
            controls.id = 'cd-yt-controls';
            controls.className = 'absolute inset-0 pointer-events-none flex justify-between items-center px-2 z-10';
            controls.innerHTML = `
              <button class="pointer-events-auto bg-black/40 hover:bg-black/60 backdrop-blur-md text-white p-2 rounded-full transition-colors" id="btn-yt-prev" title="Previous video">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
              </button>
              <button class="pointer-events-auto bg-black/40 hover:bg-black/60 backdrop-blur-md text-white p-2 rounded-full transition-colors" id="btn-yt-next" title="Next video">
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
              </button>
            `;
            headerDiv.appendChild(controls);

            document.getElementById('btn-yt-prev').onclick = (e) => {
              e.stopPropagation();
              currentVidIdx = (currentVidIdx - 1 + videos.length) % videos.length;
              iframe.src = `https://www.youtube-nocookie.com/embed/${videos[currentVidIdx].id}?rel=0&modestbranding=1`;
            };
            document.getElementById('btn-yt-next').onclick = (e) => {
              e.stopPropagation();
              currentVidIdx = (currentVidIdx + 1) % videos.length;
              iframe.src = `https://www.youtube-nocookie.com/embed/${videos[currentVidIdx].id}?rel=0&modestbranding=1`;
            };
          }
        } else if (heroPlaceholder) {
          heroPlaceholder.classList.remove('hidden');
        }

        // Attractions List
        const attrList = document.getElementById('cd-attractions-list');
        if (city.beats && city.beats.length > 0) {
          const intentMap = {
            spiritual: { icon: "om", color: "purple" },
            cultural: { icon: "compass", color: "blue" },
            heritage: { icon: "landmark", color: "amber" },
            nature: { icon: "tree-pine", color: "emerald" },
            leisure: { icon: "coffee", color: "orange" },
            adventure: { icon: "mountain", color: "red" }
          };

          attrList.innerHTML = city.beats.map(b => {
            const intents = (b.intent || []).map(intent => {
              const map = intentMap[intent] || { icon: "star", color: "slate" };
              return `<span class="inline-flex items-center gap-1 bg-${map.color}-50 border border-${map.color}-200 text-${map.color}-700 text-[10px] font-semibold px-2 py-0.5 rounded-md">
                        <i data-lucide="${map.icon}" class="w-3 h-3"></i> ${intent.charAt(0).toUpperCase() + intent.slice(1)}
                      </span>`;
            }).join('');

            const paceLabels = { short: '⚡ Short (< 1 hr)', standard: '🚶 Standard (1-2 hrs)', deep: '🔍 Deep Dive (2+ hrs)' };
            const paces = (b.pace || ['standard']).map(pace => {
              return `<span class="inline-flex items-center gap-1 bg-slate-100 border border-slate-200 text-slate-700 text-[10px] font-semibold px-2 py-0.5 rounded-md">
                        ${paceLabels[pace] || pace}
                      </span>`;
            }).join('');

            const mobilityLabels = { easy: '♿ Easy Access', walk: '🚶 Walking Required', trek: '🧗 Trek / Strenuous' };
            const mobility = mobilityLabels[b.mobility] || (b.mobility || 'Easy Access');
            const formattedHour = b.hour ? (b.hour.toString().padStart(2, '0') + ':00') : 'Flexible';
            const mapsUrl = b.mapsUrl || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.title + ' ' + city.name)}`;

            return `
              <details class="group bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <summary class="flex items-center justify-between p-3.5 cursor-pointer list-none hover:bg-slate-50 transition-colors [&::-webkit-details-marker]:hidden">
                  <div class="flex items-center gap-3 min-w-0">
                    <div class="bg-blue-50 p-2 rounded-lg text-blue-600 shrink-0">
                      <i data-lucide="${b.icon || 'map-pin'}" class="w-4 h-4"></i>
                    </div>
                    <h4 class="font-bold text-slate-800 text-sm truncate">${b.title}</h4>
                  </div>
                  <div class="text-slate-400 group-open:rotate-180 transition-transform shrink-0 ml-2">
                    <i data-lucide="chevron-down" class="w-4 h-4"></i>
                  </div>
                </summary>
                
                <div class="p-4 pt-1 border-t border-slate-100 bg-slate-50/50 space-y-3">
                  <div class="grid grid-cols-2 gap-3 text-xs">
                    <div>
                      <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Location</p>
                      <p class="text-slate-700 font-medium truncate mt-0.5">${b.where || city.name}</p>
                    </div>
                    <div>
                      <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Time</p>
                      <p class="text-slate-700 font-medium mt-0.5">${formattedHour}</p>
                    </div>
                  </div>

                  ${(intents || paces) ? `
                    <div class="flex flex-wrap gap-1.5 pt-1">
                      ${intents}
                      ${paces}
                    </div>
                  ` : ''}

                  <div class="flex items-center justify-between pt-2 border-t border-slate-100">
                    <span class="text-xs text-slate-500 font-medium">${mobility}</span>
                    <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-xs text-blue-600 hover:text-blue-800 font-bold hover:underline">
                      <i data-lucide="navigation" class="w-3 h-3"></i> Google Maps
                    </a>
                  </div>

                  ${b.notes ? `
                    <div class="pt-2 border-t border-slate-100 text-xs text-slate-600 leading-relaxed">
                      ${b.notes}
                    </div>
                  ` : ''}
                </div>
              </details>
            `;
          }).join('');
        } else {
          attrList.innerHTML = `<p class="text-xs text-slate-400 italic">No top attractions listed yet for this city.</p>`;
        }

        // Nearby Destinations
        const nearbyList = document.getElementById('cd-nearby-list');
        if (window.KYT_DISTANCE_MATRIX && window.KYT_DISTANCE_MATRIX[city.id]) {
          const CITY_ALIASES = { bangalore: 'bengaluru', mangalore: 'udupi', mangaluru: 'udupi', hubballi: 'hubli' };
          const nearby = Object.entries(window.KYT_DISTANCE_MATRIX[city.id])
            .sort((a, b) => a[1] - b[1])
            .slice(0, 8);

          if (nearby.length > 0) {
            nearbyList.innerHTML = nearby.map(([nId, dist]) => {
              const targetId = CITY_ALIASES[nId] || nId;
              const nCity = window.KYT_CITIES.find(c => c.id === targetId);
              if (!nCity) return '';

              return `
                <div class="bg-white rounded-xl border border-slate-200 p-3 hover:border-blue-400 hover:shadow-sm cursor-pointer transition-all flex flex-col h-full" data-nearby-id="${targetId}">
                  <h4 class="font-bold text-slate-800 text-xs truncate">${nCity.name}</h4>
                  <p class="text-[10px] text-blue-600 font-semibold mb-1">${dist} km away</p>
                  <p class="text-[10px] text-slate-500 line-clamp-2 leading-tight flex-1">${nCity.notes || 'Explore this nearby destination.'}</p>
                  <button type="button" class="mt-2 w-full py-1 bg-slate-100 hover:bg-blue-600 hover:text-white text-slate-700 text-[10px] font-bold rounded-lg transition-colors flex items-center justify-center gap-1">
                    <span>Explore</span> <i data-lucide="arrow-right" class="w-3 h-3"></i>
                  </button>
                </div>
              `;
            }).join('');
          } else {
            nearbyList.innerHTML = `<p class="text-xs text-slate-400 italic col-span-2">No nearby destinations found.</p>`;
          }
        } else {
          nearbyList.innerHTML = `<p class="text-xs text-slate-400 italic col-span-2">Distance data not available.</p>`;
        }

        if (window.lucide) lucide.createIcons();

        // Show Slide-Over
        cityOverlay.classList.remove('hidden');
        setTimeout(() => {
          cityOverlay.classList.remove('opacity-0');
          cityPanel.classList.remove('translate-y-full', 'md:translate-x-full');
        }, 10);
      }

      function closeCityDetail(pushHistory = true) {
        if (!cityOverlay || !cityPanel) return;

        if (pushHistory) {
          const url = new URL(window.location.href);
          if (url.searchParams.has('city')) {
            url.searchParams.delete('city');
            window.history.pushState({ cityId: null }, '', url.toString());
          }
        }
        cityHistoryStack.length = 0;

        // Stop video iframe
        const oldIframe = document.getElementById('cd-hero-yt');
        if (oldIframe) oldIframe.remove();
        const oldControls = document.getElementById('cd-yt-controls');
        if (oldControls) oldControls.remove();

        cityOverlay.classList.add('opacity-0');
        cityPanel.classList.add('translate-y-full', 'md:translate-x-full');
        setTimeout(() => {
          cityOverlay.classList.add('hidden');
        }, 300);
      }

      // Delegate clicks on city cards
      citiesGrid.addEventListener('click', (e) => {
        const card = e.target.closest('[data-city-id]');
        if (card) {
          openCityDetail(card.dataset.cityId);
        }
      });

      // Delegate clicks on nearby city cards in modal
      const nearbyContainer = document.getElementById('cd-nearby-list');
      if (nearbyContainer) {
        nearbyContainer.addEventListener('click', (e) => {
          const nCard = e.target.closest('[data-nearby-id]');
          if (nCard) {
            openCityDetail(nCard.dataset.nearbyId, true);
          }
        });
      }

      // Close & Back buttons
      if (btnCloseCity) {
        btnCloseCity.addEventListener('click', () => closeCityDetail());
      }
      if (btnBackCity) {
        btnBackCity.addEventListener('click', () => {
          if (cityHistoryStack.length > 1) {
            cityHistoryStack.pop(); // pop current
            const prevCityId = cityHistoryStack.pop(); // pop previous to re-open
            openCityDetail(prevCityId, true);
          } else {
            closeCityDetail();
          }
        });
      }

      // Share city button
      if (btnShareCity) {
        btnShareCity.addEventListener('click', () => {
          const currentCityId = document.getElementById('cd-title').dataset.cityId;
          const currentCityName = document.getElementById('cd-title').textContent;
          const url = new URL(window.location.href);
          url.searchParams.set('city', currentCityId);
          const shareData = {
            title: `${currentCityName} - KYT Destination`,
            text: `Explore ${currentCityName} on KYT: attractions, travel styles, and nearby gems!`,
            url: url.toString()
          };
          if (navigator.share) {
            navigator.share(shareData).catch(() => {});
          } else {
            navigator.clipboard.writeText(url.toString())
              .then(() => alert(`Link for ${currentCityName} copied to clipboard!`))
              .catch(() => {});
          }
        });
      }

      // Main Customize button in modal
      if (cdBtnAddMain) {
        cdBtnAddMain.addEventListener('click', () => {
          document.getElementById('btn-edit-plan').click();
        });
      }

      // Overlay background click
      cityOverlay.addEventListener('click', (e) => {
        if (e.target === cityOverlay) {
          closeCityDetail();
        }
      });

      // Keydown Escape
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !cityOverlay.classList.contains('hidden')) {
          closeCityDetail();
        }
      });

      // Popstate handling (back/forward browser buttons)
      window.addEventListener('popstate', (e) => {
        const params = new URLSearchParams(window.location.search);
        const cityParam = params.get('city');
        if (cityParam) {
          openCityDetail(cityParam, false);
        } else if (!cityOverlay.classList.contains('hidden')) {
          closeCityDetail(false);
        }
      });

      // Direct open if ?city= is in query string on page load
      const initialCity = params.get('city');
      if (initialCity) {
        openCityDetail(initialCity, false);
      }
      
      lucide.createIcons();
    });
  </script>
</body>
</html>
