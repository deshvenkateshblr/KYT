<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KYT - Home</title>
  <link rel="stylesheet" href="index.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center font-sans text-slate-800">

  <main class="w-full max-w-md p-6 bg-white rounded-3xl shadow-xl border border-slate-100 flex flex-col items-center text-center">
    <div class="mb-8 flex flex-col items-center">
      <div class="p-2 bg-white rounded-2xl shadow-sm border border-slate-100 mb-3">
        <img src="icons/KYT.jpg" alt="KYT Logo" class="w-24 h-24 object-contain rounded-xl">
      </div>
      <p class="text-slate-500 font-medium">Know Your Travel</p>
    </div>

    <div id="loading" class="text-slate-400 text-sm animate-pulse">Checking trip status...</div>

    <div id="options-container" class="w-full flex flex-col gap-4 hidden">
      <!-- Options injected by index.js -->
    </div>
  </main>

  <script src="index.js"></script>
</body>
</html>
