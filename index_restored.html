<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#3B82F6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="KYT">

  <title>KYT — Know Your Travel</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind theme config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            kyt: {
              bg:      '#F8FAFC',
              card:    '#FFFFFF',
              text:    '#0F172A',
              subtext: '#64748B',
              accent:  '#3B82F6',
              done:    '#10B981'
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- App styles -->
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/animations.css">
</head>

<body class="bg-kyt-bg text-kyt-text font-sans min-h-screen flex flex-col items-center overflow-x-hidden relative">

  <!-- ═══════════════════════════════════════════════════════════════════════
       MAIN VIEW — Active trip / carousel
  ════════════════════════════════════════════════════════════════════════ -->
  <main id="main-view" class="w-full max-w-md px-4 pt-10 pb-8 flex-1 flex flex-col relative h-full transition-opacity duration-300">

    <!-- Cover image blurred background -->
    <div id="main-cover-bg" class="hidden"></div>

    <!-- Settings button -->
    <div class="absolute top-6 right-6 z-30">
      <button id="btn-edit-trip"
              class="p-3 bg-white/80 backdrop-blur-md rounded-full shadow-sm text-kyt-subtext hover:text-kyt-text hover:bg-white active:scale-90 transition-all border border-slate-100">
        <i data-lucide="settings-2" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Clock -->
    <header class="text-center mb-8 flex flex-col items-center mt-4">
      <h1 id="live-time"
          class="text-[3.5rem] font-extrabold tracking-tight text-kyt-text mb-1 leading-none drop-shadow-sm"
          style="font-feature-settings: 'tnum';">--:--</h1>
      <p id="live-date"
         class="text-sm font-semibold text-kyt-subtext uppercase tracking-widest bg-white/50 px-4 py-1.5 rounded-full shadow-sm backdrop-blur-sm">
        Loading…
      </p>
    </header>

    <!-- Trip identity -->
    <section class="flex flex-col items-center mb-2 z-10 px-6">
      <p class="text-[11px] font-bold text-kyt-accent uppercase tracking-widest mb-1.5 flex items-center gap-1.5">
        <i data-lucide="plane" class="w-3.5 h-3.5"></i> Current Trip
      </p>
      <h2 id="main-trip-title" class="text-2xl font-extrabold tracking-tight text-kyt-text text-center leading-tight">
        My Trip
      </h2>
    </section>

    <!-- Trip notes (collapsible) -->
    <div id="main-trip-notes-wrap" class="hidden px-6 mb-4 z-10">
      <details class="group">
        <summary class="text-[11px] font-bold text-kyt-subtext uppercase tracking-widest cursor-pointer list-none flex items-center gap-1.5 select-none">
          <i data-lucide="sticky-note" class="w-3.5 h-3.5"></i>
          Trip Notes
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 transition-transform group-open:rotate-180"></i>
        </summary>
        <p id="main-trip-notes"
           class="mt-2 text-[13px] text-slate-600 leading-relaxed font-medium bg-white/70 backdrop-blur-sm p-3 rounded-xl border border-slate-100 shadow-sm">
        </p>
      </details>
    </div>

    <!-- Step count indicator -->
    <p id="step-position-indicator" class="text-center text-[11px] font-bold text-kyt-subtext uppercase tracking-widest mb-3 z-10"></p>

    <!-- Carousel -->
    <div class="relative w-full flex-1 flex flex-col min-h-[500px] prevent-select">
      <button id="btn-prev"
              class="absolute left-0 top-1/2 -translate-y-1/2 -ml-3 md:-ml-12 z-20 bg-white/80 backdrop-blur-md rounded-full p-2 shadow-lg text-kyt-text hover:bg-white active:scale-90 transition-all disabled:opacity-0 disabled:pointer-events-none">
        <i data-lucide="chevron-left" class="w-6 h-6"></i>
      </button>

      <div id="carousel-track"
           class="w-full h-full relative overflow-visible flex items-center justify-center cursor-grab active:cursor-grabbing pb-8">
        <article id="hero-card"
                 class="bg-white rounded-[2rem] w-full p-6 shadow-2xl shadow-blue-900/5 border border-slate-100 flex flex-col will-change-transform">
          <!-- Dynamic content injected by carousel.js -->
        </article>
      </div>

      <button id="btn-next"
              class="absolute right-0 top-1/2 -translate-y-1/2 -mr-3 md:-mr-12 z-20 bg-white/80 backdrop-blur-md rounded-full p-2 shadow-lg text-kyt-text hover:bg-white active:scale-90 transition-all disabled:opacity-0 disabled:pointer-events-none">
        <i data-lucide="chevron-right" class="w-6 h-6"></i>
      </button>
    </div>
  </main>


  <!-- ═══════════════════════════════════════════════════════════════════════
       CONFIG VIEW — Trip settings panel
  ════════════════════════════════════════════════════════════════════════ -->
  <aside id="config-view"
         class="fixed inset-0 bg-kyt-bg z-50 flex flex-col w-full max-w-md mx-auto hidden animate-fade-in overflow-hidden">

    <!-- Header -->
    <div class="px-6 pt-12 pb-6 bg-white border-b border-slate-100 shadow-sm flex items-center justify-between">
      <h2 class="text-xl font-extrabold text-kyt-text">Configure Trip</h2>
      <button id="btn-close-config"
              class="p-2 -mr-2 text-kyt-subtext hover:text-kyt-text bg-slate-50 rounded-full active:scale-90 transition-transform">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Scrollable body -->
    <div class="flex-1 overflow-y-auto p-6 space-y-8 no-scrollbar">

      <!-- Trip name -->
      <section>
        <label for="input-trip-name"
               class="block text-[11px] font-bold text-kyt-subtext uppercase tracking-widest mb-2">Trip Name</label>
        <input type="text" id="input-trip-name"
               class="w-full text-lg font-bold text-kyt-text bg-white border-2 border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-kyt-accent focus:ring-4 focus:ring-blue-500/10 transition-all shadow-sm"
               placeholder="e.g. Summer Vacation">
      </section>

      <!-- Trip notes -->
      <section>
        <label for="input-trip-notes"
               class="block text-[11px] font-bold text-kyt-subtext uppercase tracking-widest mb-2">Trip Notes (optional)</label>
        <textarea id="input-trip-notes" rows="3"
                  class="w-full text-base font-medium text-slate-700 bg-white border-2 border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-kyt-accent shadow-sm resize-none"
                  placeholder="Visa notes, packing reminders, emergency contacts…"></textarea>
      </section>

      <!-- Cover image -->
      <section>
        <label class="block text-[11px] font-bold text-kyt-subtext uppercase tracking-widest mb-2">Cover Image (optional)</label>

        <!-- Preview -->
        <div id="config-cover-preview-wrap" class="hidden mb-3 relative">
          <img id="config-cover-preview"
               src="" alt="Cover"
               class="w-full h-32 object-cover rounded-2xl border border-slate-200 shadow-sm">
          <button id="btn-clear-cover"
                  class="absolute top-2 right-2 p-1.5 bg-white/80 backdrop-blur-sm rounded-full text-slate-500 hover:text-rose-500 shadow-sm border border-slate-200 transition-colors">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        </div>

        <input type="file" id="config-cover-input" class="hidden" accept="image/*">
        <button type="button" onclick="document.getElementById('config-cover-input').click()"
                class="w-full py-3 border-2 border-dashed border-slate-300 rounded-xl text-slate-500 font-bold hover:bg-slate-50 hover:border-slate-400 hover:text-slate-700 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
          <i data-lucide="image" class="w-5 h-5"></i>
          Upload Cover Photo
        </button>
      </section>

      <!-- Steps list -->
      <section>
        <div class="flex justify-between items-end mb-4">
          <label class="block text-[11px] font-bold text-kyt-subtext uppercase tracking-widest">Timeline Steps</label>
          <span id="step-count-badge" class="text-xs font-bold bg-blue-100 text-kyt-accent px-2 py-0.5 rounded-md">0 items</span>
        </div>

        <div id="config-steps-list" class="space-y-3">
          <!-- Injected by config.js -->
        </div>

        <button id="btn-add-step"
                class="mt-4 w-full py-4 border-2 border-dashed border-slate-300 rounded-xl text-slate-500 font-bold hover:bg-slate-50 hover:border-slate-400 hover:text-slate-700 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
          <i data-lucide="plus" class="w-5 h-5"></i>
          Add New Step
        </button>
      </section>

      <!-- Export / Import -->
      <section class="flex gap-3 pt-4 border-t border-slate-100">
        <input type="file" id="input-import-file" class="hidden" accept=".json">
        <button type="button" onclick="document.getElementById('input-import-file').click()"
                class="flex-1 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-600 font-bold hover:bg-slate-100 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-[13px] shadow-sm">
          <i data-lucide="download" class="w-4 h-4"></i> Import Trip
        </button>
        <button type="button" id="btn-export-trip"
                class="flex-1 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-600 font-bold hover:bg-slate-100 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-[13px] shadow-sm">
          <i data-lucide="upload" class="w-4 h-4"></i> Export Trip
        </button>
      </section>
    </div>

    <!-- Save button -->
    <div class="p-6 bg-white border-t border-slate-100 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.05)]">
      <button id="btn-save-config"
              class="w-full py-4 bg-kyt-text text-white font-extrabold rounded-2xl shadow-lg shadow-slate-900/20 hover:bg-slate-800 active:scale-[0.98] transition-all text-lg">
        Save &amp; Close
      </button>
    </div>
  </aside>


  <!-- ═══════════════════════════════════════════════════════════════════════
       STEP FORM VIEW — Add / Edit a step
  ════════════════════════════════════════════════════════════════════════ -->
  <aside id="step-form-view"
         class="fixed inset-0 bg-kyt-bg z-[60] flex flex-col w-full max-w-md mx-auto hidden animate-fade-in overflow-hidden">

    <!-- Header -->
    <div class="px-6 pt-12 pb-6 bg-white border-b border-slate-100 shadow-sm flex items-center justify-between">
      <h2 id="form-view-title" class="text-xl font-extrabold text-kyt-text">Add Step</h2>
      <button id="btn-close-form"
              class="p-2 -mr-2 text-kyt-subtext hover:text-kyt-text bg-slate-50 rounded-full active:scale-90 transition-transform">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Scrollable body -->
    <div class="flex-1 overflow-y-auto p-6 space-y-6 no-scrollbar">

      <input type="hidden" id="form-step-id" value="">

      <!-- Title -->
      <section>
        <label for="form-step-title"
               class="block text-[11px] font-bold text-kyt-subtext uppercase tracking-widest mb-2">Step Title</label>
        <input type="text" id="form-step-title"
               class="w-full text-lg font-bold text-kyt-text bg-white border-2 border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-kyt-accent focus:ring-4 focus:ring-blue-500/10 transition-all shadow-sm"
               placeholder="e.g. Flight to NYC">
      </section>

      <!-- Category icons -->
      <section>
        <label class="block text-[11px] font-bold text-kyt-subtext uppercase tracking-widest mb-2">Category</label>
        <div class="flex gap-3 overflow-x-auto no-scrollbar pb-2 pt-1 px-1 -mx-1">

          <label class="cursor-pointer shrink-0 vcr-btn vcr-inactive rounded-[1.2rem] overflow-hidden">
            <input type="radio" name="step-icon" value="plane" class="peer hidden" checked>
            <div class="w-[72px] h-[72px] flex flex-col items-center justify-center text-slate-400 peer-checked:text-white peer-checked:bg-kyt-accent transition-colors">
              <i data-lucide="plane" class="w-6 h-6 mb-1"></i>
              <span class="text-[10px] font-extrabold uppercase tracking-wide">Travel</span>
            </div>
          </label>

          <label class="cursor-pointer shrink-0 vcr-btn vcr-inactive rounded-[1.2rem] overflow-hidden">
            <input type="radio" name="step-icon" value="bed" class="peer hidden">
            <div class="w-[72px] h-[72px] flex flex-col items-center justify-center text-slate-400 peer-checked:text-white peer-checked:bg-indigo-500 transition-colors">
              <i data-lucide="bed" class="w-6 h-6 mb-1"></i>
              <span class="text-[10px] font-extrabold uppercase tracking-wide">Stay</span>
            </div>
          </label>

          <label class="cursor-pointer shrink-0 vcr-btn vcr-inactive rounded-[1.2rem] overflow-hidden">
            <input type="radio" name="step-icon" value="utensils" class="peer hidden">
            <div class="w-[72px] h-[72px] flex flex-col items-center justify-center text-slate-400 peer-checked:text-white peer-checked:bg-orange-500 transition-colors">
              <i data-lucide="utensils" class="w-6 h-6 mb-1"></i>
              <span class="text-[10px] font-extrabold uppercase tracking-wide">Food</span>
            </div>
          </label>

          <label class="cursor-pointer shrink-0 vcr-btn vcr-inactive rounded-[1.2rem] overflow-hidden">
            <input type="radio" name="step-icon" value="ticket" class="peer hidden">
            <div class="w-[72px] h-[72px] flex flex-col items-center justify-center text-slate-400 peer-checked:text-white peer-checked:bg-emerald-500 transition-colors">
              <i data-lucide="ticket" class="w-6 h-6 mb-1"></i>
              <span class="text-[10px] font-extrabold uppercase tracking-wide">Activity</span>
            </div>
          </label>

          <label class="cursor-pointer shrink-0 vcr-btn vcr-inactive rounded-[1.2rem] overflow-hidden">
            <input type="radio" name="step-icon" value="shopping-bag" class="peer hidden">
            <div class="w-[72px] h-[72px] flex flex-col items-center justify-center text-slate-400 peer-checked:text-white peer-checked:bg-pink-500 transition-colors">
              <i data-lucide="shopping-bag" class="w-6 h-6 mb-1"></i>
              <span class="text-[10px] font-extrabold uppercase tracking-wide">Shop</span>
            </div>
          </label>

          <label class="cursor-pointer shrink-0 vcr-btn vcr-inactive rounded-[1.2rem] overflow-hidden">
            <input type="radio" name="step-icon" value="camera" class="peer hidden">
            <div class="w-[72px] h-[72px] flex flex-col items-center justify-center text-slate-400 peer-checked:text-white peer-checked:bg-violet-500 transition-colors">
              <i data-lucide="camera" class="w-6 h-6 mb-1"></i>
              <span class="text-[10px] font-extrabold uppercase tracking-wide">Explore</span>
            </div>
          </label>

          <label class="cursor-pointer shrink-0 vcr-btn vcr-inactive rounded-[1.2rem] overflow-hidden">
            <input type="radio" name="step-icon" value="coffee" class="peer hidden">
            <div class="w-[72px] h-[72px] flex flex-col items-center justify-center text-slate-400 peer-checked:text-white peer-checked:bg-amber-600 transition-colors">
              <i data-lucide="coffee" class="w-6 h-6 mb-1"></i>
              <span class="text-[10px] font-extrabold uppercase tracking-wide">Break</span>
            </div>
          </label>

        </div>
      </section>

      <!-- Date & Time -->
      <section>
        <label for="form-step-time"
               class="block text-[11px] font-bold text-kyt-subtext uppercase tracking-widest mb-2">Target Date &amp; Time</label>
        <input type="datetime-local" id="form-step-time"
               class="w-full text-base font-bold text-kyt-text bg-white border-2 border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-kyt-accent shadow-sm">
      </section>

      <!-- Location -->
      <section class="relative">
        <label for="form-step-where"
               class="block text-[11px] font-bold text-kyt-subtext uppercase tracking-widest mb-2">Location Name / Address</label>
        <div class="relative mb-3">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <i data-lucide="map-pin" class="w-5 h-5 text-slate-400"></i>
          </div>
          <input type="text" id="form-step-where" autocomplete="off"
                 class="w-full text-base font-bold text-kyt-text bg-white border-2 border-slate-200 rounded-xl pl-11 pr-4 py-3 focus:outline-none focus:border-kyt-accent shadow-sm"
                 placeholder="e.g. Kempegowda Airport T2">
        </div>

        <label for="form-step-map-url"
               class="block text-[11px] font-bold text-kyt-subtext uppercase tracking-widest mb-2 mt-4">Google Maps URL (optional)</label>
        <div class="relative mb-3">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <i data-lucide="link" class="w-5 h-5 text-slate-400"></i>
          </div>
          <input type="url" id="form-step-map-url"
                 class="w-full text-base font-medium text-slate-700 bg-white border-2 border-slate-200 rounded-xl pl-11 pr-4 py-3 focus:outline-none focus:border-kyt-accent shadow-sm"
                 placeholder="https://maps.app.goo.gl/…">
        </div>
      </section>

      <!-- Notes -->
      <section>
        <label for="form-step-notes"
               class="block text-[11px] font-bold text-kyt-subtext uppercase tracking-widest mb-2">Notes &amp; Details</label>
        <textarea id="form-step-notes" rows="3"
                  class="w-full text-base font-medium text-slate-700 bg-white border-2 border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-kyt-accent shadow-sm resize-none"
                  placeholder="Booking references, reminders…"></textarea>
      </section>

      <!-- Attachments -->
      <section>
        <div class="flex justify-between items-end mb-2">
          <label class="block text-[11px] font-bold text-kyt-subtext uppercase tracking-widest">Attachments (Max 4)</label>
          <span id="attachment-count-badge" class="text-[10px] font-bold bg-slate-100 text-slate-500 px-2 py-0.5 rounded-md">0/4</span>
        </div>

        <div id="form-attachments-list" class="space-y-2 mb-3 empty:hidden"></div>

        <div id="attachment-error"
             class="text-rose-600 text-[11px] font-bold mb-3 hidden bg-rose-50 p-3 rounded-xl border border-rose-100 flex gap-2 items-start">
          <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 mt-0.5"></i>
          <span id="attachment-error-text">File is too large.</span>
        </div>

        <div class="flex gap-2" id="attachment-controls">
          <input type="file" id="form-step-file" class="hidden" multiple accept="application/pdf,image/*,.doc,.docx">
          <button type="button" onclick="document.getElementById('form-step-file').click()"
                  class="flex-1 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-600 font-bold hover:bg-slate-100 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-sm shadow-sm">
            <i data-lucide="upload" class="w-4 h-4"></i> Upload File
          </button>
          <button type="button" id="btn-show-link-input"
                  class="flex-1 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-600 font-bold hover:bg-slate-100 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-sm shadow-sm">
            <i data-lucide="link" class="w-4 h-4"></i> Add Link
          </button>
        </div>

        <div id="link-input-container" class="hidden mt-3 flex gap-2 animate-fade-in">
          <input type="url" id="form-step-link-url"
                 class="flex-1 text-sm font-medium text-slate-700 bg-white border-2 border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-kyt-accent shadow-sm"
                 placeholder="Paste Drive/Web link…">
          <button type="button" id="btn-add-link"
                  class="px-4 bg-kyt-text text-white font-bold rounded-xl shadow-sm hover:bg-slate-800 transition-all text-sm">Add</button>
        </div>
      </section>

      <div class="pb-10"></div>
    </div>

    <!-- Save step button -->
    <div class="p-6 bg-white border-t border-slate-100 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.05)]">
      <button id="btn-save-step"
              class="w-full py-4 bg-kyt-accent text-white font-extrabold rounded-2xl shadow-lg shadow-blue-500/30 hover:bg-blue-600 active:scale-[0.98] transition-all text-lg flex items-center justify-center gap-2">
        <i data-lucide="save" class="w-5 h-5"></i>
        Save Step
      </button>
    </div>
  </aside>


  <!-- ═══════════════════════════════════════════════════════════════════════
       FILE VIEWER VIEW — In-app attachment preview
  ════════════════════════════════════════════════════════════════════════ -->
  <aside id="file-viewer-view"
         class="fixed inset-0 bg-kyt-bg z-[70] flex flex-col w-full max-w-md mx-auto hidden animate-fade-in overflow-hidden">

    <div class="px-6 pt-12 pb-6 bg-white border-b border-slate-100 shadow-sm flex items-center justify-between z-10">
      <h2 id="viewer-title" class="text-xl font-extrabold text-kyt-text truncate pr-4">File</h2>
      <button id="btn-close-viewer"
              class="p-2 -mr-2 text-kyt-subtext hover:text-kyt-text bg-slate-50 rounded-full active:scale-90 transition-transform">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <div id="viewer-content"
         class="flex-1 bg-slate-100 flex items-center justify-center overflow-hidden relative">
    </div>

    <div class="p-6 bg-white border-t border-slate-100 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.05)]">
      <button id="btn-download-file"
              class="w-full py-4 bg-slate-800 text-white font-extrabold rounded-2xl shadow-lg shadow-slate-900/20 hover:bg-slate-900 active:scale-[0.98] transition-all text-lg flex items-center justify-center gap-2">
        <i data-lucide="download" class="w-5 h-5"></i> Download File
      </button>
    </div>
  </aside>


  <!-- ═══════════════════════════════════════════════════════════════════════
       SCRIPTS — Service worker registration + ES module entry point
  ════════════════════════════════════════════════════════════════════════ -->
  <script>
    // Register service worker for PWA / offline support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('[SW] Registered:', reg.scope))
          .catch(err => console.warn('[SW] Registration failed:', err));
      });
    }
  </script>

  <!-- App entry point (ES modules) -->
  <script type="module" src="./js/app.js"></script>

  <!-- Initialise Lucide icons for static HTML elements -->
  <script>
    document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
  </script>

</body>
</html>
